[package]
name = "rust-test"
version = "0.1.0"
edition = "2024"

[lib]
name = "rust_test"
path = "src/lib.rs"

[[bin]]
name = "rust-test"
path = "src/main.rs"

[[bench]]
name = "transaction_store"
harness = false

[dependencies]
clap = { version = "4.5.48", features = ["derive"] }
csv = "1.4.0"
env_logger = "0.11.8"
log = "0.4.28"
rusqlite = { version = "0.32.1", features = ["bundled"] }
rust_decimal = { version = "1.43.0", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
tempfile = "3.27.0"
thiserror = "2.0.0"

[dev-dependencies]
criterion = { version = "0.5.1", features = ["html_reports"] }
